log_format privacy_safe '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                        '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
limit_req_zone $binary_remote_addr zone=music_general:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=music_login:10m rate=6r/m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log privacy_safe;
    client_max_body_size 2m;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location = /music-api/api/v1/system/cookies { return 404; }
    location = /music-api/api/v1/system/cookies/ { return 404; }
    location = /music-api/music/cookies { return 404; }
    location = /music-api/music/cookies/ { return 404; }

    location ^~ /music-api/api/v1/system/qr_login/ {
        limit_req zone=music_login burst=3 nodelay;
        proxy_pass http://music-gateway:8787/api/v1/system/qr_login/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location /music-api/ {
        limit_req zone=music_general burst=40 nodelay;
        proxy_pass http://music-gateway:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
