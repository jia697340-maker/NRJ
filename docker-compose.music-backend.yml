name: clingy-music-backend

services:
  edge:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - music-gateway
    ports:
      - "80:80"
      - "443:443"
    environment:
      MUSIC_DOMAIN: ${MUSIC_DOMAIN:?请在 .env 中填写音乐服务域名}
    volumes:
      - ./deployment/Caddyfile.music:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  music-gateway:
    build: ./music-gateway
    restart: unless-stopped
    depends_on:
      - music-public
      - music-auth
    environment:
      MUSIC_PUBLIC_UPSTREAM: http://music-public:8080
      MUSIC_AUTH_UPSTREAM: http://music-auth:8080
      MUSIC_ALLOWED_ORIGINS: ${MUSIC_ALLOWED_ORIGINS:?请填写静态网站地址}
      MUSIC_SESSION_TTL_DAYS: ${MUSIC_SESSION_TTL_DAYS:-90}
      MUSIC_COOKIE_SECURE: "true"
      MUSIC_COOKIE_SAME_SITE: None
    volumes:
      - music-session-data:/data

  music-public:
    image: guohuiyuan/go-music-api:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    working_dir: /tmp/music-runtime
    command: ["/home/appuser/go-music-api", "web", "--port", "8080"]
    tmpfs:
      - /tmp/music-runtime

  music-auth:
    image: guohuiyuan/go-music-api:latest
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    working_dir: /tmp/music-runtime
    command: ["/home/appuser/go-music-api", "web", "--port", "8080"]
    tmpfs:
      - /tmp/music-runtime

volumes:
  music-session-data:
  caddy-data:
  caddy-config:
