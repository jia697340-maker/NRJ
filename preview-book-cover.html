<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 翻开式书本预览</title>
    <style>
        :root {
            --bg-color: #f0f0f5;
            --paper-color: #fdfbf7;
            --accent-color: #2c3e50;
            --gold: #d4af37;
            --danger: #c0392b;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            background-image: radial-gradient(#e0e0e0 1px, transparent 1px);
            background-size: 20px 20px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .header {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
        }

        /* 3D 场景容器 */
        .scene {
            perspective: 2000px;
            margin-bottom: 30px;
        }

        /* 书本主体 */
        .book {
            position: relative;
            width: 400px;
            height: 600px;
            transform-style: preserve-3d;
            transition: transform 0.8s ease;
            box-shadow: 20px 20px 40px rgba(0,0,0,0.15), 0 0 20px rgba(0,0,0,0.05);
            border-radius: 4px 12px 12px 4px;
            /* 打开时让整本书稍微往右移一点，保持居中视觉 */
        }

        .book.is-open {
            transform: translateX(100px);
        }

        /* 封面容器（负责翻转） */
        .cover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform-origin: left center;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.645, 0.045, 0.355, 1);
            z-index: 10;
            cursor: pointer;
        }

        .book.is-open .cover {
            transform: rotateY(-140deg);
            box-shadow: 20px 20px 40px rgba(0,0,0,0.2);
        }

        /* 封面的正面（外表面） */
        .cover-front {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 4px 12px 12px 4px;
            overflow: hidden;
            background: #fff;
        }

        .cover-front img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 封面左侧的书脊压痕感 */
        .cover-front::after {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 15px;
            background: linear-gradient(to right, rgba(255,255,255,0.4), rgba(0,0,0,0.1) 40%, rgba(255,255,255,0.2) 60%, transparent);
            pointer-events: none;
        }

        /* 封面的反面（内侧） */
        .cover-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            transform: rotateY(180deg);
            border-radius: 12px 4px 4px 12px;
            background: #2c3e50; /* 深色内封 */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.1'/%3E%3C/svg%3E");
            box-shadow: inset -5px 0 15px rgba(0,0,0,0.2);
        }

        /* 书的内页（创作控制塔） */
        .inner-page {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--paper-color);
            border-radius: 4px 12px 12px 4px;
            z-index: 1;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* 纸张纹理 */
            background-image: url("data:image/svg+xml,%3Csvg width='100' height='100' viewBox='0 0 100 100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
            box-shadow: inset 5px 0 15px rgba(0,0,0,0.05);
        }

        /* 内部排版样式 */
        .inner-header {
            text-align: center;
            margin-bottom: 50px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
            padding-bottom: 20px;
            width: 100%;
        }

        .inner-title {
            font-size: 22px;
            color: #333;
            letter-spacing: 2px;
            margin: 0 0 10px 0;
        }

        .inner-id {
            font-size: 12px;
            color: #888;
            font-family: monospace;
        }

        .action-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 80%;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            width: 100%;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: transparent;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.2s;
            color: #444;
        }

        .btn svg {
            width: 20px;
            height: 20px;
        }

        .btn:hover {
            background: rgba(0,0,0,0.02);
            border-color: #bbb;
            transform: translateY(-2px);
        }

        .btn-primary {
            background: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }
        .btn-primary:hover {
            background: #1a252f;
            color: white;
            border-color: #1a252f;
        }
        
        .btn-danger {
            color: var(--danger);
            border-color: rgba(192, 57, 43, 0.3);
        }
        .btn-danger:hover {
            background: rgba(192, 57, 43, 0.05);
            border-color: var(--danger);
        }

        .close-btn {
            margin-top: auto;
            background: none;
            border: none;
            color: #888;
            cursor: pointer;
            font-size: 14px;
            padding: 10px;
            text-decoration: underline;
            transition: color 0.2s;
        }
        .close-btn:hover {
            color: #333;
        }

        /* 底部提示文字 */
        .hint-text {
            color: #888;
            font-size: 15px;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            gap: 8px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 0.6; }
            50% { opacity: 1; transform: translateY(-3px); }
            100% { opacity: 0.6; }
        }

        /* 点击封面的提示手势图标 */
        .hint-icon {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

    </style>
</head>
<body>

    <div class="header">
        <h2>纯净画册模式</h2>
        <p style="color: #666; font-size: 14px;">（完全不遮挡图片，互动式展开）</p>
    </div>

    <div class="scene">
        <div class="book" id="book">
            
            <!-- 创作控制塔（内页） -->
            <div class="inner-page">
                <div class="inner-header">
                    <h3 class="inner-title">创作控制塔</h3>
                    <div class="inner-id">ID: NAI_IMG_88481234</div>
                </div>

                <div class="action-list">
                    <button class="btn btn-primary" onclick="alert('进入灵感重构 (Remix)')">
                        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="10"/><path d="M16 12a4 4 0 0 1-8 0"/></svg>
                        灵感重构 (Remix)
                    </button>
                    
                    <button class="btn" onclick="alert('保存图片到本地')">
                        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
                        保存到本地
                    </button>
                    
                    <button class="btn btn-danger" onclick="alert('丢弃此图')">
                        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
                        丢弃此图
                    </button>
                </div>

                <button class="close-btn" onclick="toggleBook(event)">合上画册</button>
            </div>

            <!-- 封面（正面和反面） -->
            <div class="cover" onclick="toggleBook(event)">
                <!-- 封面正面：纯净的图片 -->
                <div class="cover-front">
                    <img src="https://images.unsplash.com/photo-1544376798-89aa6b82c6cd?auto=format&fit=crop&w=800&q=80" alt="Cover">
                </div>
                <!-- 封面反面：深色内衬 -->
                <div class="cover-back"></div>
            </div>

        </div>
    </div>

    <!-- 底部提示 -->
    <div class="hint-text" id="hint-text">
        <svg class="hint-icon" viewBox="0 0 24 24">
            <path d="M9 11.24V7.5a2.5 2.5 0 0 1 5 0v3.74c1.21-.81 2-2.18 2-3.74C16 5.01 14.2 3 11.5 3S7 5.01 7 7.5c0 1.56.79 2.93 2 3.74zm9.84 4.63l-4.54-2.26c-.17-.07-.35-.11-.54-.11H13v-6c0-.83-.67-1.5-1.5-1.5S10 6.67 10 7.5v10.74l-3.43-.72c-.08-.01-.15-.03-.24-.03-.31 0-.59.13-.79.33l-.79.8 4.94 4.94c.27.27.65.44 1.06.44h6.79c.75 0 1.33-.55 1.44-1.28l.75-5.27c.01-.07.02-.14.02-.21 0-.69-.47-1.26-1.12-1.37z"/>
        </svg>
        <span>点击画册，翻开控制塔</span>
    </div>

    <script>
        function toggleBook(event) {
            // 阻止事件冒泡，防止重复触发
            if(event) event.stopPropagation();
            
            const book = document.getElementById('book');
            const hint = document.getElementById('hint-text');
            
            book.classList.toggle('is-open');
            
            // 打开时隐藏下方提示，合上时显示
            if (book.classList.contains('is-open')) {
                hint.style.opacity = '0';
                hint.style.animation = 'none';
            } else {
                hint.style.opacity = '1';
                hint.style.animation = 'pulse 2s infinite';
            }
        }
    </script>
</body>
</html>
